apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ember-postgres
  namespace: ember-system
  labels:
    app.kubernetes.io/part-of: ember
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ember-postgres
      component: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ember-control-api
              component: control-api
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ember-control-api
  namespace: ember-system
  labels:
    app.kubernetes.io/part-of: ember
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ember-control-api
      component: control-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ember-postgres
              component: database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ember-gateway
              component: gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
