apiVersion: v1
kind: Service
metadata:
  name: ember-postgres
  namespace: ember-system
  labels:
    app.kubernetes.io/name: ember-postgres
    app.kubernetes.io/part-of: ember
    component: database
spec:
  selector:
    app.kubernetes.io/name: ember-postgres
    component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
