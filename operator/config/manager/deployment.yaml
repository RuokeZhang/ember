apiVersion: apps/v1
kind: Deployment
metadata:
  name: ember-operator-controller-manager
  namespace: ember-system
  labels:
    app.kubernetes.io/name: ember-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ember-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ember-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: ember-operator-manager
      containers:
        - name: manager
          image: ember-operator:dev
          imagePullPolicy: IfNotPresent
          command:
            - /ember-operator
          args:
            - --leader-elect
            - --watch-namespace=ember-system
            - --simulation-mode
            - --enable-keda
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
