apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferenceendpoints.serving.ember.dev
spec:
  group: serving.ember.dev
  scope: Namespaced
  names:
    plural: inferenceendpoints
    singular: inferenceendpoint
    kind: InferenceEndpoint
    shortNames:
      - iep
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [ownerID, model, profile]
              properties:
                ownerID:
                  type: string
                  minLength: 3
                  maxLength: 63
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{2,62}$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: ownerID is immutable
                model:
                  type: object
                  required: [id, revision]
                  properties:
                    id:
                      type: string
                      minLength: 1
                    revision:
                      type: string
                      minLength: 1
                profile:
                  type: string
                  enum: [small, standard, tp2]
                  default: standard
                scaling:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                      format: int32
                      minimum: 0
                      default: 0
                    maxReplicas:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 10
                      default: 1
                    targetQueueDepth:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 128
                      default: 4
                    idleTimeoutSeconds:
                      type: integer
                      format: int32
                      minimum: 60
                      maximum: 86400
                      default: 900
                  x-kubernetes-validations:
                    - rule: self.minReplicas <= self.maxReplicas
                      message: minReplicas must be <= maxReplicas
                placement:
                  type: object
                  properties:
                    cachePreference:
                      type: string
                      enum: [Preferred, Required]
                      default: Preferred
                    maxColdStartFallbackSeconds:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 3600
                      default: 120
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum: [Pending, Progressing, Ready, Degraded, Deleting]
                workloadNamespace:
                  type: string
                endpointURL:
                  type: string
                replicas:
                  type: object
                  properties:
                    desired:
                      type: integer
                      format: int32
                    ready:
                      type: integer
                      format: int32
                placement:
                  type: object
                  properties:
                    node:
                      type: string
                    cacheState:
                      type: string
                model:
                  type: object
                  properties:
                    resolvedDigest:
                      type: string
                    sizeBytes:
                      type: integer
                      format: int64
                lastActivityTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      lastProbeTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Model
          type: string
          jsonPath: .spec.model.id
        - name: Ready
          type: integer
          jsonPath: .status.replicas.ready
