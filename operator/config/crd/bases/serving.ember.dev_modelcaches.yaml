apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelcaches.serving.ember.dev
spec:
  group: serving.ember.dev
  scope: Cluster
  names:
    plural: modelcaches
    singular: modelcache
    kind: ModelCache
    shortNames:
      - mc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [modelID, revision, digest, sizeBytes]
              properties:
                modelID:
                  type: string
                revision:
                  type: string
                digest:
                  type: string
                sizeBytes:
                  type: integer
                  format: int64
                nodePoolSelector:
                  type: object
                  additionalProperties:
                    type: string
                retentionPolicy:
                  type: string
                  default: LRUWithFloor
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                referencingEndpoints:
                  type: integer
                  format: int32
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      state:
                        type: string
                        enum: [Pending, Loading, Ready, Failed]
                      progressBytes:
                        type: integer
                        format: int64
                      materializedAt:
                        type: string
                        format: date-time
                      lastUsedAt:
                        type: string
                        format: date-time
                      message:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: References
          type: integer
          jsonPath: .status.referencingEndpoints
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
