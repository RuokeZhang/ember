apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ember-operator-manager-role
rules:
  - apiGroups: [serving.ember.dev]
    resources: [inferenceendpoints]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.ember.dev]
    resources: [inferenceendpoints/status]
    verbs: [get, update, patch]
  - apiGroups: [serving.ember.dev]
    resources: [inferenceendpoints/finalizers]
    verbs: [update]
  - apiGroups: [serving.ember.dev]
    resources: [modelcaches]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.ember.dev]
    resources: [modelcaches/status]
    verbs: [get, update, patch]
  - apiGroups: [serving.ember.dev]
    resources: [modelcaches/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, services, pods, nodes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
