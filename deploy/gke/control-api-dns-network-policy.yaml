apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ember-control-api-gke-dns
  namespace: ember-system
  labels:
    app.kubernetes.io/part-of: ember
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ember-control-api
      component: control-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: GKE_DNS_CIDR
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
