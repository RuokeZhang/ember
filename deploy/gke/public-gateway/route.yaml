apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ember-public
  namespace: ember-system
  labels:
    app.kubernetes.io/name: ember-public-gateway
    app.kubernetes.io/part-of: ember
spec:
  parentRefs:
    - name: ember-public
      sectionName: https
  hostnames:
    - EMBER_GATEWAY_HOST
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: ember-gateway
          port: 8080
