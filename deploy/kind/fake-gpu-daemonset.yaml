apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ember-fake-gpu
  namespace: ember-system
  labels:
    app.kubernetes.io/name: ember-fake-gpu
    app.kubernetes.io/part-of: ember
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ember-fake-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ember-fake-gpu
        app.kubernetes.io/part-of: ember
    spec:
      nodeSelector:
        ember.dev/gpu: l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      serviceAccountName: ember-fake-gpu
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
        - name: plugin
          image: ember-fake-gpu:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DEVICE_COUNT
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ember-fake-gpu
  namespace: ember-system
  labels:
    app.kubernetes.io/part-of: ember
automountServiceAccountToken: false
