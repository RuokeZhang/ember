apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: ember
nodes:
  - role: control-plane
  - role: worker
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ember.dev/gpu=l4"
            register-with-taints: "nvidia.com/gpu=present:NoSchedule"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ember.dev/gpu=l4"
            register-with-taints: "nvidia.com/gpu=present:NoSchedule"
